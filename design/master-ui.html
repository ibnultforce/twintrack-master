<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TwinTrack Master UI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Follows the HR and Accounts portal designs: left sidebar, big page title, white cards, teal accent, pill statuses. */
:root {
  --background: #f4f6fa;
  --surface: #ffffff;
  --surface-muted: #f8fafc;
  --border: #e1e6ee;
  --border-strong: #ccd4df;
  --ink: #111a2c;
  --ink-muted: #5c6879;
  --accent: #0e7c70;
  --accent-soft: #e0f3f0;
  --on-accent: #ffffff;
  --good: #17703f;
  --good-soft: #dcf7e5;
  --warning: #8f4a07;
  --warning-soft: #fdf0c8;
  --danger: #b01f27;
  --danger-soft: #fde3e4;
  --neutral: #4b586a;
  --neutral-soft: #e5e9f0;
  --sidebar: #ffffff;
  --review: #17202e;
  --review-ink: #dbe3ec;
  --review-line: #3a4656;
  --shadow: 0 1px 2px rgb(17 26 44 / 4%);
  --font-body: "Inter", "Segoe UI", system-ui, sans-serif;
  --font-mono: Consolas, "Courier New", monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --background: #05080d;
    --surface: #10151d;
    --surface-muted: #151b24;
    --border: #232b36;
    --border-strong: #3a4553;
    --ink: #f2f5f8;
    --ink-muted: #9fa9b6;
    --accent: #1ce8cf;
    --accent-soft: #0f2b2c;
    --on-accent: #03201c;
    --good: #4eea91;
    --good-soft: #12352a;
    --warning: #fcc23c;
    --warning-soft: #3a2f14;
    --danger: #ff7b8e;
    --danger-soft: #3b1620;
    --neutral: #b0bac7;
    --neutral-soft: #222a35;
    --sidebar: #05080d;
    --review: #1a2330;
    --shadow: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --background: #05080d;
  --surface: #10151d;
  --surface-muted: #151b24;
  --border: #232b36;
  --border-strong: #3a4553;
  --ink: #f2f5f8;
  --ink-muted: #9fa9b6;
  --accent: #1ce8cf;
  --accent-soft: #0f2b2c;
  --on-accent: #03201c;
  --good: #4eea91;
  --good-soft: #12352a;
  --warning: #fcc23c;
  --warning-soft: #3a2f14;
  --danger: #ff7b8e;
  --danger-soft: #3b1620;
  --neutral: #b0bac7;
  --neutral-soft: #222a35;
  --sidebar: #05080d;
  --review: #1a2330;
  --shadow: none;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--background); color: var(--ink); font: 400 14px/1.45 var(--font-body); font-variant-numeric: tabular-nums; }
h1, h2, h3, p { margin: 0; }
h1, h2 { text-wrap: balance; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button, input, select { font: inherit; }

/* Review bar: part of this prototype only, not the product. */
.review { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 8px 16px; background: var(--review); color: var(--review-ink); font-size: 12px; }
.review-group { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.review strong { font-weight: 600; }
.review select, .review button { min-height: 28px; padding: 3px 9px; border: 1px solid var(--review-line); border-radius: 6px; background: transparent; color: var(--review-ink); cursor: pointer; }
.review select option { color: #111a2c; background: #ffffff; }
.review button[aria-pressed="true"] { background: var(--review-ink); color: var(--review); font-weight: 600; }
.review-api { margin-left: auto; }
:root { --review-focus: #ffffff; }
.review :focus-visible { outline-color: var(--review-focus); }

/* Shell */
.shell { min-height: calc(100vh - 44px); display: grid; grid-template-columns: 216px minmax(0, 1fr); }
.sidebar { display: flex; flex-direction: column; gap: 16px; padding: 20px 12px 16px; background: var(--sidebar); border-right: 1px solid var(--border); }
.brand { display: inline-flex; align-items: center; gap: 8px; padding: 0 8px; font-size: 16px; font-weight: 700; text-decoration: none; }
.brand i { width: 10px; height: 10px; border-radius: 3px; background: var(--accent); }
.nav-groups { display: grid; gap: 16px; }
.nav-group { display: grid; gap: 2px; }
.nav-label { padding: 0 8px 4px; color: var(--ink-muted); font-size: 11px; letter-spacing: .07em; text-transform: uppercase; }
.nav-link { padding: 7px 10px; border-radius: 8px; color: var(--ink-muted); text-decoration: none; }
.nav-link:hover { color: var(--ink); }
.nav-link[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.sidebar-foot { margin-top: auto; padding: 0 8px; display: grid; justify-items: start; gap: 2px; color: var(--ink-muted); font-size: 13px; }
.sidebar-foot button { margin-top: 6px; }
main { min-width: 0; padding: 24px; display: grid; gap: 16px; align-content: start; }

/* Page header */
.page-head { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 12px 16px; }
.page-head h1 { font-size: 24px; font-weight: 700; line-height: 1.25; }
.page-head p { color: var(--ink-muted); }
.page-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.avatar { flex: none; display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-size: 11px; font-weight: 700; text-decoration: none; }
.back { color: var(--accent); font-weight: 600; text-decoration: none; justify-self: start; }
.back:hover { text-decoration: underline; }

/* Controls */
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 34px; padding: 6px 14px; border: 1px solid var(--border-strong); border-radius: 8px; background: var(--surface); color: var(--ink); font-weight: 600; text-decoration: none; white-space: nowrap; cursor: pointer; }
.btn:hover:not(:disabled) { background: var(--surface-muted); }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn-primary:hover:not(:disabled) { background: var(--accent); filter: brightness(1.08); }
.btn-danger { border-color: var(--danger); color: var(--danger); }
.btn-full { width: 100%; }
.link { padding: 0; border: 0; background: none; color: var(--accent); font-weight: 600; text-decoration: none; cursor: pointer; }
.link:hover { text-decoration: underline; }
.input { width: 100%; min-height: 36px; padding: 6px 10px; border: 1px solid var(--border-strong); border-radius: 8px; background: var(--surface); color: var(--ink); }
.input::placeholder { color: var(--ink-muted); }
.input:disabled { background: var(--surface-muted); color: var(--ink-muted); }
.input[aria-invalid="true"] { border-color: var(--danger); }
.search { width: 240px; max-width: 100%; }
.field { display: grid; gap: 4px; }
.field label { font-size: 13px; font-weight: 500; }
.hint { color: var(--ink-muted); font-size: 12px; }
.field-error { color: var(--danger); font-size: 12px; }
.form { display: grid; gap: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { padding: 5px 13px; border: 1px solid var(--border-strong); border-radius: 999px; background: transparent; color: var(--ink-muted); cursor: pointer; }
.chip:hover { color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; }
.note { color: var(--ink-muted); font-size: 13px; }

/* Pills */
.pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill-accent { background: var(--accent-soft); color: var(--accent); }
.pill-good { background: var(--good-soft); color: var(--good); }
.pill-warning { background: var(--warning-soft); color: var(--warning); }
.pill-danger { background: var(--danger-soft); color: var(--danger); }
.pill-neutral { background: var(--neutral-soft); color: var(--neutral); }
.pills { display: flex; flex-wrap: wrap; gap: 4px; }

/* Cards and tiles */
.card { min-width: 0; padding: 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.card-head h2 { font-size: 15px; font-weight: 600; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
.tile { display: grid; gap: 2px; align-content: start; padding: 14px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); }
.tile span { color: var(--ink-muted); font-size: 13px; }
.tile b { font-size: 26px; font-weight: 700; line-height: 1.25; }
.tile b.is-good { color: var(--good); }
.tile b.is-warning { color: var(--warning); }
.columns { display: grid; grid-template-columns: minmax(0, 1.8fr) minmax(280px, 1fr); gap: 16px; align-items: start; }
.stack { display: grid; gap: 16px; align-content: start; min-width: 0; }
.pair { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr)); gap: 16px; align-items: start; }
.grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(290px, 100%), 1fr)); gap: 16px; }
.module-card { display: flex; flex-direction: column; gap: 8px; min-height: 170px; }
.module-card h2 { font-size: 17px; font-weight: 600; }
.module-card .card-head { margin: 0; align-items: flex-start; }
.module-card p { color: var(--ink-muted); }
.module-card .bottom { margin-top: auto; padding-top: 8px; }

/* Tables and rows */
.table-box { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { padding: 8px; border-bottom: 1px solid var(--border-strong); color: var(--ink-muted); font-weight: 600; text-align: left; white-space: nowrap; }
td { padding: 9px 8px; border-bottom: 1px solid var(--border); vertical-align: middle; }
tbody tr:last-child td { border-bottom: 0; }
.person { display: flex; align-items: center; gap: 10px; min-width: 190px; }
.strong { font-weight: 600; }
.meta { color: var(--ink-muted); font-size: 12px; }
.muted { color: var(--ink-muted); }
.row { display: flex; justify-content: space-between; gap: 16px; padding: 9px 0; border-bottom: 1px solid var(--border); }
.row:last-child { border-bottom: 0; }
.row > span:first-child { color: var(--ink-muted); }
.row > span:last-child { text-align: right; overflow-wrap: anywhere; }
.pagination { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding-top: 12px; color: var(--ink-muted); }
.pagination div { display: flex; gap: 6px; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.empty { padding: 32px 16px; color: var(--ink-muted); text-align: center; }

/* Permission grids */
.matrix th, .matrix td { text-align: center; }
.matrix th:first-child, .matrix td:first-child { text-align: left; min-width: 170px; }
.matrix th a { color: inherit; font-weight: 600; text-decoration: none; white-space: normal; }
.matrix th a:hover { color: var(--accent); text-decoration: underline; }
.matrix tbody th { padding: 12px 8px 4px; border-bottom: 1px solid var(--border-strong); color: var(--ink); text-align: left; }
.not-granted { color: var(--ink-muted); }
.module-access { display: grid; gap: 8px; padding: 14px 0; border-bottom: 1px solid var(--border); }
.module-access:first-of-type { padding-top: 0; }
.module-access:last-child { border-bottom: 0; padding-bottom: 0; }
.module-access h3 { font-size: 14px; font-weight: 600; }

/* List on the left, the chosen item on the right */
.split { display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 16px; align-items: start; }
.side { padding: 10px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); display: grid; gap: 2px; }
.side-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 4px 8px 8px; color: var(--ink-muted); font-size: 13px; font-weight: 600; }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 8px; padding: 8px 10px; border-radius: 8px; color: var(--ink); text-decoration: none; }
.item:hover { background: var(--surface-muted); }
.item[aria-current="true"] { background: var(--accent-soft); }
.item[aria-current="true"] b { color: var(--accent); }
.item b { font-weight: 600; overflow-wrap: anywhere; }
.item small { grid-column: 1 / -1; color: var(--ink-muted); font-size: 12px; }
.item .count { color: var(--ink-muted); }
.pane { display: grid; gap: 16px; min-width: 0; }
.pane-top { display: grid; gap: 10px; }
.pane-row { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 10px 16px; }
.pane-row h2 { font-size: 18px; font-weight: 700; }
.role-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; color: var(--ink-muted); font-size: 13px; }
.avatars { display: inline-flex; }
.avatars .avatar { margin-left: -6px; box-shadow: 0 0 0 2px var(--surface); }
.avatars .avatar:first-child { margin-left: 0; }
.explain { padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-muted); color: var(--ink-muted); }
.layers { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 12px; }
.layers > div { display: grid; gap: 4px; padding: 12px 14px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-muted); }
.layers b { font-weight: 600; }
.layers span { color: var(--ink-muted); }
.grant-box { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; }
.grant-box:disabled { cursor: not-allowed; }
.segmented { display: inline-flex; border: 1px solid var(--border-strong); border-radius: 8px; overflow: hidden; }
.segmented button { padding: 4px 10px; border: 0; border-left: 1px solid var(--border-strong); background: transparent; color: var(--ink-muted); cursor: pointer; }
.segmented button:first-child { border-left: 0; }
.segmented button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.segmented button:disabled { cursor: not-allowed; opacity: .55; }
.who-has { display: flex; flex-wrap: wrap; gap: 6px; }
.who-has a { display: inline-flex; gap: 8px; padding: 5px 12px; border: 1px solid var(--border-strong); border-radius: 999px; color: var(--ink); text-decoration: none; }
.who-has a:hover { border-color: var(--accent); color: var(--accent); }
.who-has b { font-weight: 700; }
.role-assign { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: 8px; padding: 12px 0; border-bottom: 1px solid var(--border); }
.role-assign:last-child { border-bottom: 0; padding-bottom: 0; }
.privilege { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--border); }
.privilege:last-of-type { border-bottom: 0; }
.privilege-form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 12px; padding-top: 14px; border-top: 1px solid var(--border-strong); }
.privilege-form .wide { grid-column: 1 / -1; }
.method { font: 600 12px var(--font-mono); color: var(--ink-muted); }
td code { font: 13px var(--font-mono); overflow-wrap: anywhere; }
@media (max-width: 1000px) { .split { grid-template-columns: minmax(0, 1fr); } }

/* Attention list and meters, as in the HR dashboard */
.attention { margin: 0; padding: 0; list-style: none; }
.attention li { display: flex; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border); color: var(--ink-muted); }
.attention li:last-child { border-bottom: 0; }
.dot { flex: none; width: 8px; height: 8px; margin-top: 6px; border-radius: 50%; }
.dot-warning { background: var(--warning); }
.dot-danger { background: var(--danger); }
.meter { display: grid; gap: 3px; padding: 6px 0; }
.meter-text { display: flex; justify-content: space-between; gap: 12px; }
.meter-text b { font-weight: 600; }
.meter-track { height: 8px; border-radius: 4px; background: var(--neutral-soft); overflow: hidden; }
.meter-fill { height: 100%; border-radius: 4px; background: var(--accent); }

/* Access editor */
.access-module { display: grid; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--border); }
.access-module:last-child { border-bottom: 0; padding-bottom: 0; }
.access-module h3 { font-size: 14px; font-weight: 600; }
fieldset { display: grid; gap: 6px; margin: 0; padding: 0; border: 0; }
legend { margin-bottom: 6px; padding: 0; font-size: 13px; font-weight: 500; }
.check { display: flex; align-items: center; gap: 8px; }
.check input { accent-color: var(--accent); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }

/* Notices */
.notice { padding: 9px 12px; border-radius: 8px; }
.notice-good { background: var(--good-soft); color: var(--good); }
.notice-danger { background: var(--danger-soft); color: var(--danger); }
.notice-warning { background: var(--warning-soft); color: var(--warning); }

/* Sign-in pages */
.centered { min-height: calc(100vh - 44px); display: grid; place-items: center; padding: 24px 16px; }
.auth { width: 100%; max-width: 400px; display: grid; gap: 16px; justify-items: center; }
.auth .card { width: 100%; padding: 28px; display: grid; gap: 20px; }
.auth .brand { padding: 0; }
.auth h1 { font-size: 22px; line-height: 1.25; }
.auth p.lede { margin-top: 4px; color: var(--ink-muted); }

/* Dialogs */
dialog { width: min(460px, calc(100vw - 32px)); max-height: calc(100vh - 48px); padding: 22px; border: 1px solid var(--border); border-radius: 14px; background: var(--surface); color: var(--ink); }
dialog::backdrop { background: rgb(5 8 13 / 55%); }
dialog h2 { margin-bottom: 14px; font-size: 17px; font-weight: 600; }
.dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
.temporary { display: block; margin: 10px 0; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-muted); font: 15px var(--font-mono); overflow-wrap: anywhere; }

@media (max-width: 1100px) { .columns { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 820px) {
  .shell { grid-template-columns: minmax(0, 1fr); min-height: 0; }
  .sidebar { padding: 14px 16px; border-right: 0; border-bottom: 1px solid var(--border); }
  .nav-group { display: flex; flex-wrap: wrap; align-items: center; }
  .nav-label { width: 100%; }
  .sidebar-foot { margin-top: 0; grid-auto-flow: column; justify-content: start; align-items: center; gap: 10px; }
  .sidebar-foot button { margin-top: 0; }
  main { padding: 16px; }
  .review-api { margin-left: 0; }
}
@media (prefers-reduced-motion: no-preference) { .nav-link, .btn, .chip { transition: background-color .12s, color .12s; } }
</style>

const SCOPE_BREADTH = { own: 0, team: 1, all: 2 };

/* What a role template grants, as permission to scope. A grant with no stated scope applies to everyone. */
function roleGrants(role, module) {
  const grants = new Map();
  if (role.grants === '*') {
    module.resources.forEach((resource) => resource.actions.forEach((action) => grants.set(`${resource.key}.${action}`, 'all')));
    return grants;
  }
  role.grants.forEach((grant) => {
    const [permission, scope] = grant.replace(/[()]/g, '').split(' ');
    grants.set(permission, scope || 'all');
  });
  return grants;
}

/* Same rule as the API: a role plus special privileges, and the widest scope wins. */
function effectivePermissions(user, module) {
  const permissions = new Map();
  const role = module.roles.find((r) => r.key === user.assignments[module.key]);
  if (role) roleGrants(role, module).forEach((scope, permission) => permissions.set(permission, { scope, source: `Role: ${role.name}` }));
  (user.privileges[module.key] || []).forEach((permission) => {
    const grantable = module.grantable.find((g) => g.permission === permission);
    if (!grantable) return;
    const held = permissions.get(permission);
    if (!held) permissions.set(permission, { scope: grantable.scope, source: 'Special privilege' });
    else if (SCOPE_BREADTH[grantable.scope] > SCOPE_BREADTH[held.scope]) permissions.set(permission, { scope: grantable.scope, source: 'Special privilege' });
  });
  return permissions;
}

function isResourceScoped(module, permission) {
  return Boolean(module.resources.find((r) => r.key === permission.slice(0, permission.lastIndexOf('.')))?.scoped);
}

/* Unscoped resources are all or nothing, so they read "Yes" and not a scope. */
function scopePill(module, permission, scope) {
  if (!isResourceScoped(module, permission)) return pill('accent', 'Yes');
  return scope === 'all' ? pill('accent', 'All') : pill('neutral', humanize(scope));

        ${card('Active people with access, by module', meters)}
      </div>
    </div>`;
}

function accessPills(user) {
  if (user.superAdmin) return pill('accent', 'Super admin');
  const roles = state.modules.flatMap((m) => { const r = m.roles.find((x) => x.key === user.assignments[m.key]); return r ? [`${m.name}: ${r.name}`] : []; });
  const privileges = state.modules.reduce((n, m) => n + (user.privileges[m.key] || []).length, 0);
  if (!roles.length && !privileges) return '<span class="muted">No access</span>';
  return `<div class="pills">${roles.map((r) => pill('neutral', r)).join('')}${privileges ? pill('accent', `+${privileges} special`) : ''}</div>`;
}

function matchingPeople() {
  const search = state.peopleSearch.trim().toLowerCase();
  return state.people.filter((p) => (state.peopleStatus === 'all' || p.status === state.peopleStatus) && (!search || [p.name, p.email, p.title].some((text) => text.toLowerCase().includes(search))));
}

function peopleResults() {
  const matches = matchingPeople();
  if (!matches.length) return '<p class="empty">Nobody matches this search.</p>';
  const lastPage = Math.max(1, Math.ceil(matches.length / PEOPLE_PAGE_SIZE));
  state.peoplePage = Math.min(state.peoplePage, lastPage);
  const page = matches.slice((state.peoplePage - 1) * PEOPLE_PAGE_SIZE, state.peoplePage * PEOPLE_PAGE_SIZE);
  return `<div class="table-box"><table><thead><tr><th scope="col">Person</th><th scope="col">Job title</th><th scope="col">Department</th><th scope="col">Contract</th><th scope="col">Access</th><th scope="col">Status</th><th scope="col"><span class="visually-hidden">Details</span></th></tr></thead><tbody>
    ${page.map((p) => `<tr><td><div class="person">${avatar(p.name)}<div><div class="strong">${esc(p.name)}</div><div class="meta">${esc(p.email)}</div></div></div></td><td>${esc(p.title)}</td><td>${esc(humanize(p.department))}</td><td>${contractPill(p.contract)}</td><td>${accessPills(p)}</td><td>${statusPill(p.status)}</td><td><a class="link" href="#person-${esc(p.id)}" aria-label="Details for ${esc(p.name)}">Details</a></td></tr>`).join('')}
  </tbody></table></div>${pagination(state.peoplePage, PEOPLE_PAGE_SIZE, matches.length, 'people-page')}`;
}

function peopleScreen() {
  const actions = `<input class="input search" id="people-search" type="search" aria-label="Search name, email, title" placeholder="Search name, email, title" value="${esc(state.peopleSearch)}">
    ${can('user.create') ? '<button type="button" class="btn btn-primary" data-action="add-person">+ Add person</button>' : ''}`;
  return `${pageHead('People', peopleCount(state.people.length), actions)}${noticeHtml()}
    <div class="toolbar">${chips('Filter by status', 'people-status', [['all', 'All'], ['active', 'Active'], ['inactive', 'Deactivated']], state.peopleStatus)}</div>
    <section class="card" id="people-results">${peopleResults()}</section>`;
}

function personScreen(id) {
  const user = personById(id);
  if (!user) return `<a class="back" href="#people">← People</a><section class="card"><p class="empty">That person no longer exists.</p></section>`;
  const isSelf = user.id === viewer().id;
  const canUpdate = can('user.update');
  const canHr = can('hrAccess.update');
  const canEditPerson = !user.superAdmin && !isSelf;
  const canEditModule = (key) => canEditPerson && (canUpdate || (canHr && key === 'hr'));
  let explanation = 'Roles come from the fixed list in each module. Special privileges add one permission without changing the role.';
  if (user.superAdmin) explanation = 'A super admin has every role already.';
  else if (isSelf) explanation = 'Nobody can change their own access. Ask another admin.';
  else if (!canUpdate && !canHr) explanation = 'Your role can read access, but not change it.';
  else if (!canUpdate) explanation = 'Your role can change HR access only. Fixed role templates stay with Master.';

  const editors = user.superAdmin ? '' : state.modules.map((m) => {
    const readOnly = !canEditModule(m.key);
    const current = user.assignments[m.key] || '';
    return `<div class="role-assign" data-module="${esc(m.key)}">
      <div class="field"><label for="role-${esc(m.key)}">${esc(m.name)}</label><select class="input" id="role-${esc(m.key)}" data-role-select ${readOnly ? 'disabled' : ''}><option value="">No access</option>${m.roles.map((r) => `<option value="${esc(r.key)}" ${r.key === current ? 'selected' : ''}>${esc(r.name)}</option>`).join('')}</select></div>
      ${readOnly ? '' : `<button type="button" class="btn" data-action="save-role" data-value="${esc(m.key)}" aria-label="Save ${esc(m.name)} role" disabled>Save</button>`}
    </div>`;
  }).join('');

  const heldPrivileges = state.modules.flatMap((m) => (user.privileges[m.key] || []).map((permission) => {
    const details = state.privilegeDetails[privilegeKey(user.id, m.key, permission)] || {};
    const reach = m.grantable.find((g) => g.permission === permission)?.scope === 'team' ? 'their team' : 'everyone';
    return `<div class="privilege"><div><div class="strong">${esc(m.name)}: ${esc(permissionLabel(m, permission))} <span class="meta">(${reach})</span></div>
      <div class="meta">${details.until ? `Until ${esc(shortDate(details.until))}` : 'No end date'}${details.by ? ` · ${esc(details.by)}` : ''}${details.reason ? ` · ${esc(details.reason)}` : ''}</div></div>
      ${canEditModule(m.key) ? `<button type="button" class="link" data-action="remove-privilege" data-value="${esc(m.key)}|${esc(permission)}" aria-label="Remove ${esc(permission)}">Remove</button>` : ''}</div>`;
  })).join('');

  const privilegeOptions = state.modules.filter((m) => canEditModule(m.key) && m.grantable.length).map((m) => {
    const fromRole = m.roles.find((r) => r.key === user.assignments[m.key]);
    const roleScopes = fromRole ? roleGrants(fromRole, m) : new Map();
    const options = m.grantable.filter((g) => !(user.privileges[m.key] || []).includes(g.permission)).map((g) => {
      const given = roleScopes.get(g.permission);
      const isCovered = given && SCOPE_BREADTH[given] >= SCOPE_BREADTH[g.scope];
      return `<option value="${esc(m.key)}|${esc(g.permission)}" ${isCovered ? 'disabled' : ''}>${esc(permissionLabel(m, g.permission))}, ${g.scope === 'team' ? 'their team' : 'everyone'}${isCovered ? ' (already in role)' : ''}</option>`;
    }).join('');
    return options ? `<optgroup label="${esc(m.name)}, role: ${esc(fromRole ? fromRole.name : 'none')}">${options}</optgroup>` : '';
  }).join('');
  const privilegeForm = privilegeOptions ? `<form class="privilege-form" data-form="privilege" novalidate>
      <div class="field wide"><label for="privilege-permission">Give a privilege</label><select class="input" id="privilege-permission" name="privilege">${privilegeOptions}</select></div>
      <div class="field"><label for="privilege-for">For</label><select class="input" id="privilege-for" name="duration"><option value="0">No end date</option><option value="1">1 day</option><option value="7">7 days</option><option value="30">30 days</option></select></div>
      <div class="field wide"><label for="privilege-reason">Reason (kept in the activity log)</label><input class="input" id="privilege-reason" name="reason" autocomplete="off" placeholder="Plans the backend sprint with the lead" ${state.privilegeError ? 'aria-invalid="true"' : ''}>${state.privilegeError ? `<span class="field-error" role="alert">${esc(state.privilegeError)}</span>` : ''}</div>
      <div class="wide"><button type="submit" class="btn btn-primary">Give privilege</button></div>
    </form>` : '';

  const accountActions = canUpdate && !isSelf ? `<div class="actions"><button type="button" class="btn" data-action="confirm-reset">Reset password</button>${user.status === 'active' ? '<button type="button" class="btn btn-danger" data-action="confirm-status">Deactivate</button>' : '<button type="button" class="btn" data-action="confirm-status">Reactivate</button>'}</div>` : '';
  return `<a class="back" href="#people">← People</a>
    ${pageHead(user.name, user.email)}${noticeHtml()}
    <div class="pair">
      <div class="stack">
        ${card('Details', `${row('Job title', esc(user.title))}${row('Department', esc(humanize(user.department)))}${row('Team', esc(humanize(user.team)))}${row('Contract', contractPill(user.contract))}`, canUpdate ? '<button type="button" class="link" data-action="edit-person">Edit</button>' : '')}
        ${card('Account', `${row('Status', statusPill(user.status))}${row('Password', user.mustChangePassword ? 'Temporary, waiting to be changed' : 'Set by this person')}${accountActions}`)}
      </div>
      <div class="stack">
        ${card('Role in each module', `<p class="note">${esc(explanation)}</p>${editors}`, '<span class="note">One role per module</span>')}
        ${user.superAdmin ? '' : card('Special privileges', `<p class="note">One extra permission on top of their role. The role itself doesn't change.</p>${heldPrivileges || '<p class="muted" style="padding-top:8px">None.</p>'}${privilegeForm}`)}
      </div>
    </div>
    ${card('What they can do', `${user.status === 'inactive' ? '<p class="notice notice-warning" style="margin-bottom:12px">This account is deactivated, so none of this applies until it is reactivated.</p>' : ''}${effectiveAccessHtml(user, 'They have')}`)}`;
}

function rolesScreen(route) {
  const selected = selectedRole(route);
  if (!selected) return `${pageHead('Roles')}<section class="card"><p class="empty">No module has any roles yet.</p></section>`;
  const { role, module } = selected;
  state.rolesModule = module.key;
  const canEdit = can('role.update');
  const block = roleEditBlock(role, module);
  const grants = roleGrants(role, module);
  const actions = [...new Set(module.resources.flatMap((r) => r.actions))];
  const permissionTotal = module.resources.reduce((total, r) => total + r.actions.length, 0);
  const holders = peopleWithRole(module.key, role.key);

  const items = module.roles.map((r) => `<a class="item" href="#role-${esc(module.key)}-${esc(r.key)}" aria-current="${r.key === role.key}"><b>${esc(r.name)}</b><span class="count">${peopleWithRole(module.key, r.key).length}</span><small>${esc(r.description || 'No description')}</small></a>`).join('');

  const rows = module.resources.map((resource) => {
    const held = resource.actions.filter((a) => grants.has(`${resource.key}.${a}`));
    const currentScope = held.length ? grants.get(`${resource.key}.${held[0]}`) : 'own';
    const boxes = actions.map((action) => {
      if (!resource.actions.includes(action)) return '<td class="muted" aria-hidden="true">–</td>';
      const permission = `${resource.key}.${action}`;
      return `<td><input type="checkbox" class="grant-box" id="grant-${esc(permission)}" data-grant="${esc(permission)}" aria-label="${esc(humanize(action))} ${esc(resource.label)}" ${grants.has(permission) ? 'checked' : ''} ${block ? 'disabled' : ''}></td>`;
    }).join('');
    const scope = resource.scoped
      ? `<div class="segmented" role="group" aria-label="Whose ${esc(resource.label)}">${SCOPE_OPTIONS.map(([value, label]) => `<button type="button" id="scope-${esc(resource.key)}-${value}" data-action="role-scope" data-resource="${esc(resource.key)}" data-value="${value}" aria-pressed="${held.length > 0 && currentScope === value}" ${block || !held.length ? 'disabled' : ''}>${label}</button>`).join('')}</div>`
      : '<span class="muted">Everyone</span>';
    return `<tr><td><div class="strong">${esc(resource.label)}</div><div class="meta">${esc(module.key)}.${esc(resource.key)}</div></td>${boxes}<td>${scope}</td></tr>`;
  }).join('');

  const holderList = holders.length
    ? `<div class="table-box"><table><tbody>${holders.map((p) => `<tr><td><div class="person">${avatar(p.name)}<div><div class="strong">${esc(p.name)}</div><div class="meta">${esc(p.title)}</div></div></div></td><td>${statusPill(p.status)}</td><td><a class="link" href="#person-${esc(p.id)}" aria-label="Details for ${esc(p.name)}">Details</a></td></tr>`).join('')}</tbody></table></div>`
    : '<p class="empty">Nobody has this role yet.</p>';

  const roleActions = canEdit ? `<div class="page-actions">
      <button type="button" class="btn" data-action="edit-role">Edit name</button>
      <button type="button" class="btn" data-action="duplicate-role">Duplicate</button>
      ${role.isCustom ? '<button type="button" class="btn btn-danger" data-action="confirm-delete-role">Delete</button>' : ''}
    </div>` : '';

  return `${pageHead('Roles', 'What each role can do, and who has it')}${noticeHtml()}
    ${chips('Choose a module', 'roles-module', state.modules.filter((m) => m.roles.length).map((m) => [m.key, `${m.name} ${m.roles.length}`]), module.key)}
    <div class="split">
      <section class="side" aria-label="${esc(module.name)} roles">
        <div class="side-head"><span>${esc(module.name)} roles</span>${canEdit ? '<button type="button" class="link" data-action="new-role">+ New role</button>' : ''}</div>
        ${items}
      </section>
      <div class="pane">
        <section class="card pane-top">
          <div class="pane-row"><div><h2>${esc(role.name)}</h2><p class="muted">${esc(role.description || 'No description')}</p></div>${roleActions}</div>
          <div class="role-meta">
            ${role.isCustom ? pill('neutral', 'Custom role') : pill('accent', 'Default from the manifest')}
            ${holders.length ? `<span class="avatars">${holders.slice(0, 4).map((p) => avatar(p.name)).join('')}</span>` : ''}
            <span>${holders.length ? peopleCount(holders.length) : 'Nobody has this role yet'}</span>
            <span>${grants.size} of ${permissionTotal} permissions</span>
          </div>
          <p class="explain">${esc(block || 'Only access admins change this layer. HR decides who has each role and can add a special privilege, but can\'t change what a role allows.')}</p>
        </section>
        ${card(`What this role can do in ${module.name}`, `<div class="table-box"><table class="matrix"><thead><tr><th scope="col">Resource</th>${actions.map((a) => `<th scope="col">${esc(humanize(a))}</th>`).join('')}<th scope="col">Whose records</th></tr></thead><tbody>${rows}</tbody></table></div>`, '<span class="note">Changes apply on each person\'s next request</span>')}
        ${card('People with this role', holderList)}
      </div>
    </div>`;
}

function roleFormDialog(title, submitLabel, mode, values = {}) {
  return `<h2 id="dialog-title">${esc(title)}</h2><form class="form" data-form="role" data-mode="${esc(mode)}" novalidate>
    <div class="field"><label for="role-name">Role name</label><input class="input" id="role-name" name="roleName" autocomplete="off" value="${esc(values.name || '')}" ${values.error ? 'aria-invalid="true"' : ''}>${values.error ? `<span class="field-error">${esc(values.error)}</span>` : ''}</div>
    <div class="field"><label for="role-description">Who is this role for?</label><input class="input" id="role-description" name="roleDescription" autocomplete="off" value="${esc(values.description || '')}"></div>
    <div class="dialog-actions"><button type="button" class="btn" data-action="close-dialog">Cancel</button><button type="submit" class="btn btn-primary">${esc(submitLabel)}</button></div>
  </form>`;
}

function permissionsScreen() {
  const module = state.modules.find((m) => m.key === state.permissionsModule) || state.modules[0];
  const grantsByRole = module.roles.map((role) => ({ role, grants: roleGrants(role, module) }));
  const rows = module.resources.map((resource) => `<tr><th scope="rowgroup" colspan="${module.roles.length + 2}">${esc(resource.label)}</th></tr>${resource.actions.map((action) => {
    const permission = `${resource.key}.${action}`;
    const isGrantable = module.grantable.some((g) => g.permission === permission);
    return `<tr><td><div>${esc(humanize(action))}</div><div class="meta">${esc(permission)}</div></td>${grantsByRole.map(({ grants }) => `<td>${grants.has(permission) ? scopePill(module, permission, grants.get(permission)) : notGranted}</td>`).join('')}<td>${isGrantable ? pill('good', 'Allowed') : notGranted}</td></tr>`;
  }).join('')}`).join('');

  const specialRows = state.people.flatMap((p) => state.modules.flatMap((m) => (p.privileges[m.key] || []).map((permission) => ({ p, m, permission, details: state.privilegeDetails[privilegeKey(p.id, m.key, permission)] || {} }))));
  const specialTable = specialRows.length
    ? `<div class="table-box"><table><thead><tr><th scope="col">Person</th><th scope="col">Role</th><th scope="col">Privilege</th><th scope="col">Applies to</th><th scope="col">Ends</th><th scope="col">Given by and why</th><th scope="col"><span class="visually-hidden">Change</span></th></tr></thead><tbody>
      ${specialRows.map(({ p, m, permission, details }) => { const held = m.roles.find((r) => r.key === p.assignments[m.key]); return `<tr><td><div class="person">${avatar(p.name)}<div class="strong">${esc(p.name)}</div></div></td><td>${pill('neutral', `${m.name}: ${held ? held.name : 'No role'}`)}</td><td>${esc(permissionLabel(m, permission))}<div class="meta">${esc(m.key)}.${esc(permission)}</div></td><td>${esc(m.grantable.find((g) => g.permission === permission)?.scope === 'team' ? 'Their team' : 'Everyone')}</td><td style="white-space:nowrap">${details.until ? esc(shortDate(details.until)) : 'No end date'}</td><td>${esc(details.by || '·')}<div class="meta">${esc(details.reason || '')}</div></td><td><a class="link" href="#person-${esc(p.id)}" aria-label="Change access for ${esc(p.name)}">Change</a></td></tr>`; }).join('')}
    </tbody></table></div>`
    : '<p class="empty">Nobody has a special privilege. Give one on a person\'s page.</p>';

  const whoHas = module.roles.map((r) => `<a href="#role-${esc(module.key)}-${esc(r.key)}"><span>${esc(r.name)}</span><b>${peopleWithRole(module.key, r.key).length}</b></a>`).join('');
  const withoutRole = state.people.filter((p) => !p.superAdmin && !module.roles.some((r) => r.key === p.assignments[module.key])).length;

  return `${pageHead('Permissions', 'Which role can do what, in one view')}
    <div class="layers">
      <div><b>Fixed by the Master module</b><span>What each role can do, and whose records it reaches. Also which permissions HR may give one person. HR can't change these.</span></div>
      <div><b>Managed by HR</b><span>Who has which role, like Lead or Team member, and special privileges: one extra permission for one person, without changing their role.</span></div>
    </div>
    <div class="toolbar">${chips('Choose a module', 'permissions-module', state.modules.map((m) => [m.key, m.name]), module.key)}<span class="note">Super admins have every permission.</span></div>
    ${card(`Who has what in ${module.name}`, `<div class="who-has">${whoHas}<a href="#people"><span>No role</span><b>${withoutRole}</b></a></div>`)}
    ${card(`${module.name} permissions by role`, module.resources.length ? `<div class="table-box"><table class="matrix"><thead><tr><th scope="col">Permission</th>${module.roles.map((r) => `<th scope="col"><a href="#role-${esc(module.key)}-${esc(r.key)}">${esc(r.name)}</a></th>`).join('')}<th scope="col">Special privilege</th></tr></thead><tbody>${rows}</tbody></table></div><p class="note" style="margin-top:12px">${esc(SCOPE_LEGEND)} The last column shows what HR can give one person without changing their role.</p>` : '<p class="empty">This manifest lists no permissions yet.</p>')}
    ${card('People with special privileges', specialTable, pill('neutral', peopleCount(new Set(specialRows.map(({ p }) => p.id)).size)))}`;
}

/* One person's real access, for their own page and for admins looking at them. */
function effectiveAccessHtml(user, ownerText) {
  if (user.superAdmin) return `<p class="muted">${esc(ownerText)} every permission in every module, as a super admin.</p>`;
  const sections = state.modules.map((module) => {
    const permissions = effectivePermissions(user, module);
    const rows = [...permissions].map(([permission, { scope, source }]) => `<tr><td>${esc(permissionLabel(module, permission))}<div class="meta">${esc(permission)}</div></td><td>${scopePill(module, permission, scope)}</td><td>${source === 'Special privilege' ? pill('warning', source) : esc(source)}</td></tr>`).join('');
    return `<div class="module-access"><h3>${esc(module.name)}</h3>${permissions.size
      ? `<div class="table-box"><table><thead><tr><th scope="col">Permission</th><th scope="col">Applies to</th><th scope="col">Comes from</th></tr></thead><tbody>${rows}</tbody></table></div>`
      : '<p class="muted">No access.</p>'}</div>`;
  }).join('');
  return `${sections}<p class="note" style="margin-top:12px">${esc(SCOPE_LEGEND)}</p>`;
}

function myPermissionsScreen() {
  return `${pageHead('Your permissions', 'What you can do in each module')}
    ${card('', effectiveAccessHtml(viewer(), 'You have'))}`;
}

const ACCESS_LABELS = { public: ['Public', 'good'], signed: ['Signed in', 'neutral'], private: ['Permission', 'accent'] };

function registeredModulesScreen(route) {
  const module = state.modules.find((m) => route === `module-${m.key}`) || state.modules[0];
  const actions = can('module.create') ? `<input class="visually-hidden" id="manifest-file" type="file" accept=".json,application/json" tabindex="-1" aria-label="Manifest file"><button type="button" class="btn btn-primary" data-action="import-manifest">Import manifest</button>` : '';
  const permissionTotal = (m) => m.resources.reduce((total, r) => total + r.actions.length, 0);
  const items = state.modules.map((m) => `<a class="item" href="#module-${esc(m.key)}" aria-current="${m.key === module.key}"><b>${esc(m.name)}</b><span class="count">v${esc(m.version)}</span><small>${m.core ? 'Built in' : 'Add-on'} · ${permissionTotal(m)} permissions</small></a>`).join('');

  const resourceRows = module.resources.map((resource) => {
    const grantable = resource.actions.filter((a) => module.grantable.some((g) => g.permission === `${resource.key}.${a}`));
    return `<tr><td><div class="strong">${esc(resource.label)}</div><div class="meta">${esc(module.key)}.${esc(resource.key)}</div></td><td><div class="pills">${resource.actions.map((a) => pill('neutral', humanize(a))).join('')}</div></td><td>${resource.scoped ? 'Own, Team or Everyone' : 'Everyone'}</td><td>${grantable.length ? esc(grantable.map(humanize).join(', ')) : '<span class="muted">·</span>'}</td></tr>`;
  }).join('');
  const routes = module.routes || [];
  const publicTotal = routes.filter((r) => r[2] === 'public').length;
  const routeRows = routes.map(([method, path, access, permission, isBuilt]) => { const [label, tone] = ACCESS_LABELS[access]; return `<tr><td style="white-space:nowrap"><span class="method">${esc(method)}</span> <code>${esc(module.baseUrl + path)}</code></td><td>${pill(tone, label)}</td><td>${permission ? `<code>${esc(permission)}</code>` : '<span class="muted">·</span>'}</td><td>${isBuilt ? pill('good', 'Built') : pill('neutral', 'Planned')}</td></tr>`; }).join('');

  return `${pageHead('Modules', 'The modules loaded into Master', actions)}${noticeHtml()}
    <div class="split">
      <section class="side" aria-label="Loaded modules"><div class="side-head"><span>Loaded modules</span></div>${items}</section>
      <div class="pane">
        <section class="card pane-top">
          <div class="pane-row"><div><h2>${esc(module.name)} <span class="muted" style="font-weight:400;font-size:14px">v${esc(module.version)}</span></h2><p class="muted">${esc(module.description)}</p></div>
            ${can('module.delete') && !module.core ? `<button type="button" class="btn btn-danger" data-action="confirm-remove" data-value="${esc(module.key)}">Remove</button>` : ''}</div>
          <div class="role-meta">${module.core ? pill('accent', 'Core') : pill('neutral', 'Add-on')}<span>Frontend: ${esc(module.frontendUrl || 'not set')}</span></div>
          <p class="explain">Read-only. The manifest owns permissions and routes. To change them, change the module's manifest and import it again.</p>
        </section>
        ${card('Permissions', module.resources.length ? `<div class="table-box"><table><thead><tr><th scope="col">Resource</th><th scope="col">Actions</th><th scope="col">Whose records</th><th scope="col">HR can grant</th></tr></thead><tbody>${resourceRows}</tbody></table></div>` : '<p class="empty">This manifest lists no permissions yet.</p>', `<span class="note">${permissionTotal(module)} total</span>`)}
        ${card('Routes', routes.length ? `<div class="table-box"><table><thead><tr><th scope="col">Route</th><th scope="col">Access</th><th scope="col">Permission</th><th scope="col">Status</th></tr></thead><tbody>${routeRows}</tbody></table></div>` : '<p class="empty">This manifest lists no routes yet.</p>', `<span class="note">${publicTotal} public · ${routes.length - publicTotal} need a token</span>`)}
      </div>
    </div>`;
}

function activityScreen() {
  const matches = state.activity.filter((e) => state.activityFilter === 'all' || e.action.startsWith(state.activityFilter));
  const page = matches.slice((state.activityPage - 1) * ACTIVITY_PAGE_SIZE, state.activityPage * ACTIVITY_PAGE_SIZE);
  return `${pageHead('Activity log', 'Who signed in, and who changed people, access or modules')}
    <div class="toolbar">${chips('Filter by action', 'activity-filter', [['all', 'All'], ['auth.', 'Sign-in'], ['user.', 'People'], ['role.', 'Roles'], ['module.', 'Modules']], state.activityFilter)}<span class="note">The log can't be edited or deleted by anyone, including admins.</span></div>
    ${card('', activityTable(page) + pagination(state.activityPage, ACTIVITY_PAGE_SIZE, matches.length, 'activity-page'))}`;
}

const SCREENS = {
  modules: modulesScreen, 'my-permissions': myPermissionsScreen, profile: profileScreen, overview: overviewScreen, people: peopleScreen,
  roles: rolesScreen, permissions: permissionsScreen, 'registered-modules': registeredModulesScreen, activity: activityScreen,
};

/* ---------- Layout and routing ---------- */

function reviewBar() {
  const isBuilt = BUILT_ROUTES.includes(parentRoute(state.route));
  const themeNow = document.documentElement.dataset.theme || 'auto';
  return `<div class="review">
    <span class="review-group"><strong>Prototype</strong> Example data. Nothing is saved.</span>
    <span class="review-group"><label for="view-as"><strong>View as</strong></label>
      <select id="view-as">${state.people.filter((p) => ['u01', 'u03', 'u05', 'u04', 'u08', 'u09'].includes(p.id)).map((p) => `<option value="${p.id}" ${p.id === state.viewerId ? 'selected' : ''}>${esc(p.name)} (${esc(viewerRoleLabel(p))})</option>`).join('')}</select></span>
    <span class="review-group" role="group" aria-label="Theme"><strong>Theme</strong>${[['light', 'Light'], ['dark', 'Dark']].map(([value, label]) => `<button type="button" data-action="theme" data-value="${value}" aria-pressed="${themeNow === value}">${label}</button>`).join('')}</span>
    <span class="review-group"><strong>Screens</strong><button type="button" data-action="go" data-value="sign-in">Sign in</button><button type="button" data-action="go" data-value="temporary-password">Temporary password</button></span>
    <span class="review-group review-api">${isBuilt ? 'API for this screen: built' : 'API for this screen: planned, step 4'}</span>
  </div>`;
}

function viewerRoleLabel(p) {
  if (p.superAdmin) return 'Super admin';
  const masterRole = MODULE_OPTIONS[0].roles.find((r) => r.key === p.assignments.master);
  if (masterRole) return masterRole.name;
  const hrRole = MODULE_OPTIONS[1].roles.find((r) => r.key === p.assignments.hr);
  if (hrRole) return `HR ${hrRole.name}`;
  return (p.privileges.hr || []).length ? 'Special privilege only' : 'No roles';
}

function shell(content) {
  const consoleNavigation = allowedConsoleNavigation();
  const me = viewer();
  const current = parentRoute(state.route);
  const link = (item) => `<a class="nav-link" href="#${item.route}" ${item.route === current ? 'aria-current="page"' : ''}>${esc(item.label)}</a>`;
  return `<div class="shell">
    <aside class="sidebar">
      <a class="brand" href="#modules"><i aria-hidden="true"></i>TwinTrack</a>
      <nav class="nav-groups" aria-label="Main">
        <div class="nav-group"><p class="nav-label">Account</p>${ACCOUNT_NAVIGATION.map(link).join('')}</div>
        ${consoleNavigation.length ? `<div class="nav-group"><p class="nav-label">Administration</p>${consoleNavigation.map(link).join('')}</div>` : ''}
      </nav>
      <div class="sidebar-foot"><span>${esc(me.superAdmin ? 'Super admin' : me.title)}</span><span>${esc(me.name)}</span><button type="button" class="link" data-action="sign-out">Sign out</button></div>
    </aside>
    <main>${content}</main>
  </div>`;
}

function isRouteAllowed(route) {
  const item = CONSOLE_NAVIGATION.find((n) => n.route === parentRoute(route));
  return !item || can(item.permission);
}

function render() {
  document.getElementById('review-bar').innerHTML = reviewBar();
  const app = document.getElementById('app');
  const { route } = state;
  if (route === 'sign-in' || !state.isSignedIn) { app.innerHTML = signInScreen(); renderDialog(); return; }
  if (route === 'temporary-password') { app.innerHTML = temporaryPasswordScreen(); renderDialog(); return; }

  let content;
  if (!isRouteAllowed(route)) content = `${pageHead('No access')}<section class="card"><p class="empty">You don't have permission to open this page.</p></section>`;
  else if (route.startsWith('person-')) content = personScreen(route.slice('person-'.length));
  else content = (SCREENS[parentRoute(route)] || SCREENS.modules)(route);
  app.innerHTML = shell(content);
  renderDialog();
}

/* A notice set before moving to another page shows on arrival, once. */
function takeNoticeForNewPage() {
  state.notice = state.pendingNotice || null;
  state.pendingNotice = null;
  state.privilegeError = '';
}

function go(route) {
  if (location.hash === `#${route}`) { takeNoticeForNewPage(); state.route = route; render(); return; }
  location.hash = route;
}

function readRoute() {
  const name = location.hash.slice(1);
  state.route = name || 'overview';
  takeNoticeForNewPage();
  render();
  window.scrollTo(0, 0);
}

/* ---------- Dialogs ---------- */

function renderDialog() {
  const root = document.getElementById('dialog-root');
  root.innerHTML = state.dialog ? `<dialog id="active-dialog" aria-labelledby="dialog-title">${state.dialog}</dialog>` : '';
  const dialog = document.getElementById('active-dialog');
  if (dialog) {
    dialog.showModal();
    dialog.addEventListener('close', () => { state.dialog = null; root.innerHTML = ''; });
  }
}
function openDialog(html) { state.dialog = html; renderDialog(); }
function closeDialog() { state.dialog = null; render(); }

function personFormDialog(title, submitLabel, user, error) {
  const values = user || { name: '', email: '', title: '', department: '', team: '', contract: 'permanent' };
  const field = (name, label, value) => `<div class="field"><label for="person-${name}">${label}</label><input class="input" id="person-${name}" name="${name}" autocomplete="off" value="${esc(value)}" ${error && error.field === name ? 'aria-invalid="true"' : ''}>${error && error.field === name ? `<span class="field-error">${esc(error.message)}</span>` : ''}</div>`;
  return `<h2 id="dialog-title">${esc(title)}</h2><form class="form" data-form="person" data-person-id="${user ? esc(user.id) : ''}" novalidate>
    ${field('name', 'Full name', values.name)}${field('email', 'Work email', values.email)}${field('title', 'Job title', values.title)}${field('department', 'Department', values.department)}${field('team', 'Team', values.team)}
    <div class="field"><label for="person-contract">Contract</label><select class="input" id="person-contract" name="contract">${['permanent', 'intern', 'contractor'].map((c) => `<option value="${c}" ${c === values.contract ? 'selected' : ''}>${humanize(c)}</option>`).join('')}</select></div>
    <div class="dialog-actions"><button type="button" class="btn" data-action="close-dialog">Cancel</button><button type="submit" class="btn btn-primary">${esc(submitLabel)}</button></div>
  </form>`;
}

function temporaryPasswordDialog(name, password) {
  return `<h2 id="dialog-title">Temporary password for ${esc(name)}</h2>
    <p class="muted">Copy it now and pass it on securely. You won't see it again, and they'll need to change it when they first sign in.</p>
    <code class="temporary" id="temporary-value">${esc(password)}</code>
    <p class="note" id="copy-message" role="status"></p>
    <div class="dialog-actions"><button type="button" class="btn" data-action="copy-password">Copy password</button><button type="button" class="btn btn-primary" data-action="close-dialog">Done</button></div>`;
}

function confirmDialog(title, text, action, label, tone, value = '') {
  return `<h2 id="dialog-title">${esc(title)}</h2><p class="muted">${esc(text)}</p>
    <div class="dialog-actions"><button type="button" class="btn" data-action="close-dialog">Cancel</button><button type="button" class="btn ${tone === 'danger' ? 'btn-danger' : 'btn-primary'}" data-action="${action}" data-value="${esc(value)}">${esc(label)}</button></div>`;
}

/* ---------- Actions ---------- */

const currentPerson = () => personById(state.route.slice('person-'.length));

const ACTIONS = {
  go: (el) => go(el.dataset.value),
  theme(el) { document.documentElement.dataset.theme = el.dataset.value; render(); },
  'sign-out'() { state.isSignedIn = false; state.signInError = ''; go('sign-in'); },
  'open-module'(el) { state.notice = { tone: 'good', text: `In the real app, this opens ${el.dataset.name} at ${el.dataset.value}. You stay signed in.` }; render(); },
  'close-dialog': closeDialog,
  'people-status'(el) { state.peopleStatus = el.dataset.value; state.peoplePage = 1; render(); },
  'people-page'(el) { state.peoplePage = Number(el.dataset.value); document.getElementById('people-results').innerHTML = peopleResults(); },
  'activity-filter'(el) { state.activityFilter = el.dataset.value; state.activityPage = 1; render(); },
  'activity-page'(el) { state.activityPage = Number(el.dataset.value); render(); },
  'roles-module'(el) { state.rolesModule = el.dataset.value; go('roles'); },
  'new-role'() { openDialog(roleFormDialog('New role', 'Create role', 'new')); },
  'duplicate-role'() { const { role } = selectedRole(state.route); openDialog(roleFormDialog(`Duplicate ${role.name}`, 'Duplicate role', 'duplicate', { name: `${role.name} copy`, description: role.description })); },
  'edit-role'() { const { role } = selectedRole(state.route); openDialog(roleFormDialog(`Edit ${role.name}`, 'Save', 'edit', { name: role.name, description: role.description })); },
  'confirm-delete-role'() {
    const { role, module } = selectedRole(state.route);
    const holders = peopleWithRole(module.key, role.key).length;
    openDialog(confirmDialog(`Delete ${role.name}?`, holders ? `${peopleCount(holders)} will lose this role and any access it gives, starting on their next request.` : 'Nobody has this role, so nobody loses access.', 'delete-role', 'Delete role', 'danger'));
  },
  'delete-role'() {
    const { role, module } = selectedRole(state.route);
    module.roles = module.roles.filter((r) => r.key !== role.key);
    peopleWithRole(module.key, role.key).forEach((p) => { delete p.assignments[module.key]; });
    recordActivity('role.deleted', role.name, module.name);
    state.dialog = null;
    state.pendingNotice = { tone: 'good', text: `${role.name} has been deleted.` };
    go('roles');
  },
  'role-scope'(el) {
    const { role, module } = selectedRole(state.route);
    const grants = roleGrants(role, module);
    module.resources.find((r) => r.key === el.dataset.resource).actions.forEach((action) => {
      const permission = `${el.dataset.resource}.${action}`;
      if (grants.has(permission)) grants.set(permission, el.dataset.value);
    });
    saveRoleGrants(role, grants);
    recordActivity('role.updated', role.name, module.name);
    const focusId = el.id;
    render();
    document.getElementById(focusId)?.focus();
  },
  'save-role'(el) {
    const user = currentPerson();
    const key = el.dataset.value;
    const role = el.closest('.role-assign').querySelector('select').value;
    if (role) user.assignments[key] = role; else delete user.assignments[key];
    const moduleName = state.modules.find((m) => m.key === key).name;
    recordActivity('user.role_changed', user.name, moduleName);
    state.notice = { tone: 'good', text: `${user.name}'s ${moduleName} role has been saved. It applies on their next request.` };
    render();
  },
  'remove-privilege'(el) {
    const user = currentPerson();
    const [key, permission] = el.dataset.value.split('|');
    user.privileges[key] = (user.privileges[key] || []).filter((held) => held !== permission);
    delete state.privilegeDetails[privilegeKey(user.id, key, permission)];
    recordActivity('user.privileges_changed', user.name, state.modules.find((m) => m.key === key).name);
    state.notice = { tone: 'good', text: `${permission} has been removed from ${user.name}.` };
    render();
  },
  'permissions-module'(el) { state.permissionsModule = el.dataset.value; render(); },
  'add-person'() { openDialog(personFormDialog('Add person', 'Add person')); },
  'edit-person'() { const user = currentPerson(); openDialog(personFormDialog(`Edit ${user.name}`, 'Save', user)); },
  'confirm-reset'() { const user = currentPerson(); openDialog(confirmDialog(`Reset ${user.name}'s password?`, "Their current password stops working, and you'll get a temporary one to pass on.", 'reset-password', 'Reset password')); },
  'reset-password'() {
    const user = currentPerson();
    user.mustChangePassword = true;
    recordActivity('user.password_reset', user.name);
    state.dialog = temporaryPasswordDialog(user.name, temporaryPassword());
    render();
  },
  'confirm-status'() {
    const user = currentPerson();
    const isActive = user.status === 'active';
    openDialog(confirmDialog(`${isActive ? 'Deactivate' : 'Reactivate'} ${user.name}?`, isActive ? "They are signed out everywhere at once, and can't sign in until reactivated." : 'They will be able to sign in again.', 'toggle-status', isActive ? 'Deactivate' : 'Reactivate', isActive ? 'danger' : 'primary'));
  },
  'toggle-status'() {
    const user = currentPerson();
    user.status = user.status === 'active' ? 'inactive' : 'active';
    recordActivity(user.status === 'active' ? 'user.reactivated' : 'user.deactivated', user.name);
    state.dialog = null;
    state.notice = { tone: 'good', text: `${user.name} is now ${user.status === 'active' ? 'active' : 'deactivated'}.` };
    render();
  },
  'import-manifest'() { document.getElementById('manifest-file').click(); },
  'confirm-remove'(el) { const m = state.modules.find((x) => x.key === el.dataset.value); openDialog(confirmDialog(`Remove ${m.name}?`, "Everyone with a role in this module loses access to it until it's imported again.", 'remove-module', 'Remove module', 'danger', m.key)); },
  'remove-module'(el) {
    const removed = state.modules.find((m) => m.key === el.dataset.value);
    state.modules = state.modules.filter((m) => m.key !== removed.key);
    recordActivity('module.removed', removed.name);
    state.dialog = null;
    state.notice = { tone: 'good', text: `${removed.name} has been removed.` };
    render();
  },
  async 'copy-password'() {
    const message = document.getElementById('copy-message');
    try {
      await navigator.clipboard.writeText(document.getElementById('temporary-value').textContent);
      message.textContent = 'Copied.';
    } catch {
      message.textContent = 'Your browser blocked copying. Select the password and copy it by hand.';
    }
  },
};

const FORMS = {
  'sign-in'(form) {
    if (!form.password.value) { state.signInError = 'That email and password do not match.'; render(); return; }
    const match = state.people.find((p) => p.email === form.email.value.trim().toLowerCase());
    if (match && match.status === 'active') state.viewerId = match.id;
    state.isSignedIn = true;
    state.signInError = '';
    recordActivity('auth.login');
    go('modules');
  },
  'temporary-password'() { state.isSignedIn = true; recordActivity('auth.password_changed'); go('modules'); },
  'own-name'(form) {
    const name = form.name.value.trim();
    if (!name) { state.notice = { tone: 'danger', text: 'Your name is required.' }; render(); return; }
    viewer().name = name;
    state.notice = { tone: 'good', text: 'Your name has been saved.' };
    render();
  },
  'own-password'() {
    recordActivity('auth.password_changed');
    state.notice = { tone: 'good', text: 'Your password has been changed, and your other sessions have ended.' };
    render();
  },
  privilege(form) {
    const reason = form.reason.value.trim();
    if (!reason) { state.privilegeError = 'Say why they need this. The reason is kept in the activity log.'; render(); return; }
    const user = currentPerson();
    const [key, permission] = form.privilege.value.split('|');
    const days = Number(form.duration.value);
    user.privileges[key] = [...(user.privileges[key] || []), permission];
    state.privilegeDetails[privilegeKey(user.id, key, permission)] = { by: viewer().name, reason, until: days ? Date.now() + days * 24 * HOUR : null };
    state.privilegeError = '';
    recordActivity('user.privileges_changed', user.name, state.modules.find((m) => m.key === key).name);
    state.notice = { tone: 'good', text: `${user.name} now has ${permission}. It applies on their next request.` };
    render();
  },
  role(form) {
    const mode = form.dataset.mode;
    const name = form.roleName.value.trim();
    const description = form.roleDescription.value.trim();
    const { role: current, module } = selectedRole(state.route);
    const isNameTaken = module.roles.some((r) => r.name.toLowerCase() === name.toLowerCase() && !(mode === 'edit' && r.key === current.key));
    const titles = { new: ['New role', 'Create role'], duplicate: [`Duplicate ${current.name}`, 'Duplicate role'], edit: [`Edit ${current.name}`, 'Save'] }[mode];
    if (!name || isNameTaken) { openDialog(roleFormDialog(titles[0], titles[1], mode, { name, description, error: name ? `${module.name} already has a role with that name.` : 'Enter a role name.' })); return; }
    state.dialog = null;
    if (mode === 'edit') {
      current.name = name;
      current.description = description;
      recordActivity('role.updated', name, module.name);
      render();
      return;
    }
    const key = `${name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'role'}-${module.roles.length + 1}`;
    const added = { key, name, description, grants: [], isCustom: true };
    if (mode === 'duplicate') saveRoleGrants(added, roleGrants(current, module));
    module.roles = [...module.roles, added];
    recordActivity('role.created', name, module.name);
    go(`role-${module.key}-${key}`);
  },
  person(form) {
    const values = { name: form.name.value.trim(), email: form.email.value.trim().toLowerCase(), title: form.title.value.trim(), department: form.department.value.trim(), team: form.team.value.trim(), contract: form.contract.value };
    const id = form.dataset.personId;
    const existing = id ? personById(id) : null;
    const title = existing ? `Edit ${existing.name}` : 'Add person';
    const label = existing ? 'Save' : 'Add person';
    const entered = { ...existing, ...values };
    if (!values.name) { openDialog(personFormDialog(title, label, entered, { field: 'name', message: 'Enter their full name.' })); return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(values.email)) { openDialog(personFormDialog(title, label, entered, { field: 'email', message: 'Enter a valid email address.' })); return; }
    if (state.people.some((p) => p.email === values.email && p.id !== id)) { openDialog(personFormDialog(title, label, entered, { field: 'email', message: 'Someone already uses that email address.' })); return; }
    if (existing) {
      Object.assign(existing, values);
      recordActivity('user.updated', existing.name);
      state.dialog = null;
      state.notice = { tone: 'good', text: `${existing.name}'s details have been saved.` };
      render();
      return;
    }
    const added = person(`u${Date.now()}`, values.name, values.title, values.department, values.team, { ...values, mustChangePassword: true });
    state.people.push(added);
    recordActivity('user.created', added.name);
    state.dialog = temporaryPasswordDialog(added.name, temporaryPassword());
    render();
  },
};

function updatePasswordForm(input) {
  const prefix = input.dataset.passwordForm;
  const current = document.getElementById(`${prefix}-current`).value;
  const next = document.getElementById(`${prefix}-new`).value;
  const repeat = document.getElementById(`${prefix}-repeat`).value;
  let message = '';
  if (next && next.length < MIN_PASSWORD_LENGTH) message = `The new password needs at least ${MIN_PASSWORD_LENGTH} characters.`;
  else if (repeat && next !== repeat) message = 'The two new passwords do not match.';
  document.getElementById(`${prefix}-message`).textContent = message;
  document.getElementById(`${prefix}-submit`).disabled = !(current && next && repeat && !message);
}

function updateRoleSaveButton(select) {
  const section = select.closest('.role-assign');
  const button = section.querySelector('button');
  if (button) button.disabled = select.value === (currentPerson().assignments[section.dataset.module] || '');
}

/* A new tick starts at the resource's current scope, or the narrowest one, so a slip can't widen access. */
function toggleRoleGrant(box) {
  const { role, module } = selectedRole(state.route);
  const grants = roleGrants(role, module);
  const permission = box.dataset.grant;
  const resourceKey = permission.slice(0, permission.lastIndexOf('.'));
  const resource = module.resources.find((r) => r.key === resourceKey);
  if (box.checked) {
    const heldAction = resource.actions.find((a) => grants.has(`${resourceKey}.${a}`));
    grants.set(permission, heldAction ? grants.get(`${resourceKey}.${heldAction}`) : (resource.scoped ? 'own' : 'all'));
  } else {
    grants.delete(permission);
  }
  saveRoleGrants(role, grants);
  recordActivity('role.updated', role.name, module.name);
  const focusId = box.id;
  render();
  document.getElementById(focusId)?.focus();
}

async function importManifest(file) {
  try {
    const { module: details } = JSON.parse(await file.text());
    if (!details || !details.key || !details.name || !details.version) throw new Error('missing fields');
    state.modules = [...state.modules.filter((m) => m.key !== details.key), { key: details.key, name: details.name, version: details.version, description: details.description || '', core: false, frontendUrl: null, resources: [], roles: [], grantable: [] }];
    recordActivity('module.imported', details.name);
    state.notice = { tone: 'good', text: `${details.name} has been imported.` };
  } catch {
    state.notice = { tone: 'danger', text: 'That file is not a valid module manifest.' };
  }
  render();
}

/* ---------- Events ---------- */

document.addEventListener('click', (event) => {
  const el = event.target.closest('[data-action]');
  if (!el || el.disabled) return;
  const handler = ACTIONS[el.dataset.action];
  if (handler) handler(el);
});

document.addEventListener('submit', (event) => {
  event.preventDefault();
  const handler = FORMS[event.target.dataset.form];
  if (handler) handler(event.target);
});

document.addEventListener('input', (event) => {
  const { target } = event;
  if (target.id === 'people-search') {
    state.peopleSearch = target.value;
    state.peoplePage = 1;
    document.getElementById('people-results').innerHTML = peopleResults();
  }
  if (target.dataset.passwordForm) updatePasswordForm(target);
});

document.addEventListener('change', (event) => {
  const { target } = event;
  if (target.id === 'view-as') {
    state.viewerId = target.value;
    state.isSignedIn = true;
    state.notice = null;
    if (state.route === 'sign-in' || state.route === 'temporary-password') state.route = 'modules';
    render();
    return;
  }
  if (target.id === 'manifest-file' && target.files[0]) importManifest(target.files[0]);
  if ('roleSelect' in target.dataset) updateRoleSaveButton(target);
  if (target.dataset.grant) toggleRoleGrant(target);
});

window.addEventListener('hashchange', readRoute);
readRoute();
</script>
</body>
</html>
